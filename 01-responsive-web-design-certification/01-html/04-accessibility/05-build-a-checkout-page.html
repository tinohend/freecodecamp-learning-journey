<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Checkout Page</title>
    </head>

    <body>
        <h1>Checkout</h1>
        <section>
            <h2>Your Cart</h2>
            <figure>
                <img src="https://cdn.freecodecamp.org/curriculum/labs/cube.jpg" alt="a 3x3 cube toy">
                <figcaption>A 3x3 cube toy.</figcaption>
            </figure>
            <p>Rp. 50.000</p>
        </section>
        <section>
            <h2>Payment Information</h2>
            <form>
                <label 
                    for="card-name"
                >
                Card name<span aria-hidden="true">*</span>
                </label>
                <input
                    id="card-name"
                    name="card-name"    
                    type="text"
                    required
                >
                <br>
                <label 
                    for="card-number"
                >
                Card number<span aria-hidden="true">*</span>
                </label>
                <input
                    id="card-number"
                    name="card-number"    
                    type="text"
                    required
                    aria-describedby="card-number-help"
                >
            <p id="card-number-help">Please enter your 16-digit credit card numbers without spaces or dashes.</p>
            </form>
        </section>
        <section>
            <button>Place order</button>
        </section>
    </body>
</html>
