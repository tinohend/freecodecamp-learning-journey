<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Survey Form</title>
  </head>

  <body>
    <h1 id="title">freeCodeCamp Survey Form</h1>
    <p id="description">Thank you for taking the time to help us improve the platform</p>
    <form id="survey-form">
      <label 
        for="name" 
        id="name-label"
        >
        Name (required):
      </label>
      <input 
        required 
        id="name" 
        type="text"
        placeholder="e.g., John Doe"
        >
      <br>
      <label 
        for="email" 
        id="email-label"
        >
        Email (required):
      <input 
        required 
        id="email" 
        type="email"
        placeholder="example@email.com"
        >
      <br>
      <label 
        for="number" 
        id="number-label"
        >
        Age (optional):
      </label>
      <input 
        required 
        id="number" 
        type="number" 
        min="5" 
        max="150"
        placeholder="20"
        >
      
      <p>Which option best describes your current role?</p>
      <select id="dropdown">
        <option>Select current role</option>
        <option>Student</option>
        <option>Full Time Job</option>
        <option>Full Time Learner</option>
        <option>Prefer not to say</option>
        <option>Other</option>
      </select>

      <p>Would you recommend freeCodeCamp to a friend?</p>
      <input 
        checked 
        type="radio"
        name="radio-button"
        value="definitely"
        >
        Definitely
      </input>

      <input 
        type="radio" 
        name="radio-button"
        value="maybe"
        >
        Maybe
        </input>

      <input 
        type="radio" 
        name="radio-button"
        value="not-sure"
        >
        Not sure
        </input>

      <p>What is your favorite feature of freeCodeCamp?</p>
      <select id="dropdown">
        <option>Select an option</option>
        <option>Challenges</option>
        <option>Projects</option>
        <option>Community</option>
        <option>Open source</option>
      </select>

      <p>What would you like to see improved? (Check all that apply)</p>
      <input
        checked
        type="checkbox"
        id="front-end-projects"
        name="choice"
        value="front-end-projects"
      >
      Front-end Projects
      </input>
      <br>
      <input
        type="checkbox"
        id="back-end-projects"
        name="choice"
        value="back-end-projects"
      >
      Back-end Projects
      </input>
      <br>
      <input
        type="checkbox"
        id="data-visualization"
        name="choice"
        value="data-visualization"
      >
      Data Visualization
      </input>
      <br>
      <input
        type="checkbox"
        id="challenges"
        name="choice"
        value="challenges"
      >
      Challenges
      </input>
      <br>
      <input
        type="checkbox"
        id="open-source-community"
        name="choice"
        value="open-source-community"
      >
      Open Source Community
      </input>
      <br>
      <input
        type="checkbox"
        id="gitter-help-rooms"
        name="choice"
        value="gitter-help-rooms"
      >
      Gitter Help Rooms
      </input>
      <br>
      <input
        type="checkbox"
        id="videos"
        name="choice"
        value="videos"
      >
      Videos
      </input>
      <br>
      <input
        type="checkbox"
        id="city-meetups"
        name="choice"
        value="city-meetups"
      >
      City Meetups
      </input>
      <br>
      <input
        type="checkbox"
        id="wiki"
        name="choice"
        value="wiki"
      >
      Wiki
      </input>
      <br>
      <input
        type="checkbox"
        id="forum"
        name="choice"
        value="forum"
      >
      Forum
      </input>
      <br>
      <input
        type="checkbox"
        id="additional-courses"
        name="choice"
        value="additional-courses"
      >
      Additional Courses
      </input>

      <p>Any comments or suggestions?</p>
      <textarea 
        cols="30" 
        rows="10" 
        name="comments" 
        id="comments">
      </textarea>
      <br>
      <button 
        id="submit"
        type="submit"
        >
        Submit
      </button>
    </form>
  </body>
</html>
